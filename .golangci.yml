version: "2"

linters:
  enable:
    - staticcheck
    - unconvert
    - revive
    - ineffassign
    - govet
    - unused
    - misspell
  disable:
    - errcheck
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: strict
    presets:
      - comments
    paths:
      - example

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 8m